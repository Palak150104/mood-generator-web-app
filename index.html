<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mood Generator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="emoji-container"></div>

    <div class="card">
        <h1>Mood Generator</h1>

        <h2 id="mood">Your mood will appear here</h2>

        <p id="message">Click the button!</p>

        <div class="buttons">

            <button id="generate">✨ Tell me my mood</button>

            <button id="share">📤 Share my mood</button>

            <button id="reset">🔄 Reset</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
